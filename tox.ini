[tox]
envlist = py39,py310,py311,py312,lint

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312

[testenv]
deps =
    -rrequirements.txt
    pytest>=7.0.0
    pytest-cov>=4.0.0
commands =
    pytest {posargs} --cov=gateway --cov-report=term-missing

[flake8]
max-line-length = 88
exclude = .git,__pycache__,build,dist
